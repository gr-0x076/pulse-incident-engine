version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: pulse-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - pulse_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pulse-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/pulse
      - JWT_SECRET=pulse-production-super-secret-jwt-key-2026
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=pulse-production-refresh-secret-jwt-key-2026
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=200
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  pulse_mongo_data:
